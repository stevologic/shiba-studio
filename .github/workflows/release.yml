name: Release

# Tag a commit `v*` (matching package.json's version) to cut a GitHub Release:
#   git tag v0.2.0 && git push origin v0.2.0
# The in-app footer notice compares against the latest release of this repo.
# Windows and macOS packages compiled by this workflow are attached to the tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            devvit/reddit-bridge/package-lock.json

      - name: Verify tag matches package.json version
        run: |
          PKG_V=$(node -p "require('./package.json').version")
          TAG_V="${GITHUB_REF_NAME#v}"
          if [ "$PKG_V" != "$TAG_V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_V"
            exit 1
          fi

      - name: Install & verify
        run: |
          npm ci
          npm ci --prefix devvit/reddit-bridge
          npm run lint || true   # non-blocking until lint debt is zero (TODO.md §4)
          npx tsc --noEmit
          npm run build
          npm test
          npm --prefix devvit/reddit-bridge run verify

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md" > RELEASE_NOTES.md

      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  native-windows:
    name: Windows app · package
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CHANNEL: main
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build Studio and package the Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit $LASTEXITCODE" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed with exit $LASTEXITCODE" }
          npm prune --omit=dev
          if ($LASTEXITCODE -ne 0) { throw "npm prune failed with exit $LASTEXITCODE" }
          pwsh -File scripts/ci/pack-windows-app.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: shiba-studio-windows
          path: dist/native/packages/ShibaStudio-windows-x64.zip
          if-no-files-found: error

  native-macos:
    name: macOS app · package
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CHANNEL: main
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build Studio and package the macOS app
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
          bash scripts/ci/pack-macos-app.sh
      - uses: actions/upload-artifact@v6
        with:
          name: shiba-studio-macos
          path: dist/native/packages/ShibaStudio-macos.zip
          if-no-files-found: error

  release:
    needs: [verify, native-windows, native-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp artifacts/release-notes/RELEASE_NOTES.md dist/release/RELEASE_NOTES.md
          cp artifacts/shiba-studio-windows/ShibaStudio-windows-x64.zip dist/release/
          cp artifacts/shiba-studio-macos/ShibaStudio-macos.zip dist/release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/release/ShibaStudio-windows-x64.zip
            dist/release/ShibaStudio-macos.zip
